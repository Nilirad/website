# The URL the site will be built for
base_url = "https://nilirad.dev"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

theme = "tabi"

title = "Nilirad's place"

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
math_display = "mathjax"
avatar = "cat_avatar_resized.png"
social_links = []
menu = [
    { name = "blog", url = "posts", trailing_slash = true },
    { name = "about", url = "about", trailing_slash = true },
]
allowed_domains = [
    { directive = "font-src", domains = ["'self'", "data:", "https://cdnjs.cloudflare.com"] },
    { directive = "img-src", domains = ["'self'", "https://*", "data:"] },
    { directive = "media-src", domains = ["'self'", "https://cdn.jsdelivr.net/"] },
    { directive = "script-src", domains = ["'self'"] },
    { directive = "style-src", domains = ["'self'", "https://cdnjs.cloudflare.com"] },
    { directive = "frame-src", domains = ["player.vimeo.com", "https://www.youtube-nocookie.com"] },
]

[extra.sections]
posts = true
about = true
archive = false
tags = false
links = false

social_links = []
